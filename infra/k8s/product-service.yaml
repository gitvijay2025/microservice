apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/micro-product-service:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: micro-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3002

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  ports:
    - port: 3002
  selector:
    app: product-service
