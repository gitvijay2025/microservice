apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 997208471343.dkr.ecr.ap-south-1.amazonaws.com/micro-order-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: micro-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3003

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
    - port: 3003
  selector:
    app: order-service
