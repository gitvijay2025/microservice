apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 997208471343.dkr.ecr.ap-south-1.amazonaws.com/micro-user-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: micro-config
            - secretRef:
                name: micro-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
    - port: 3001
  selector:
    app: user-service
