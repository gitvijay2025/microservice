# Network Policies for Miro Microservices
# This enforces a "Zero Trust" model where Pods only talk to who they NEED to.

# 1. Deny all traffic by default (Optional but recommended for strict security)
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: default-deny-all
# spec:
#   podSelector: {}
#   policyTypes:
#   - Ingress

---
# 2. MongoDB Policy: Only allow microservices to connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-policy
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: user-service
    - podSelector:
        matchLabels:
          app: product-service
    - podSelector:
        matchLabels:
          app: order-service
    ports:
    - protocol: TCP
      port: 27017

---
# 3. Microservices Policy: Only allow traffic from the Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microservice-ingress-policy
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [user-service, product-service, order-service]}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway
    ports:
    - protocol: TCP
      port: 3001 # User Service
    - protocol: TCP
      port: 3002 # Product Service
    - protocol: TCP
      port: 3003 # Order Service

---
# 4. Gateway Policy: Only allow traffic from Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-policy
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          # Adjust this label based on your Ingress Controller namespace
          kubernetes.io/metadata.name: ingress-nginx 
    ports:
    - protocol: TCP
      port: 3000
