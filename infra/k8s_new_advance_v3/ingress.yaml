apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micro-ingress
  annotations:
    # Use Nginx as the Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    # Optional: Enable SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Optional: Increase body size for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    # Replace with your actual domain or use a wildcard/local IP
    - host: api.miro-app.local 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Routes traffic to the 'gateway' service
                name: gateway
                port:
                  number: 80
