apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  # Best Practice: High Availability - Run multiple instances of the entry point
  replicas: 3
  # Best Practice: Zero-Downtime Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Best Practice: Graceful Shutdown
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: 997208471343.dkr.ecr.ap-south-1.amazonaws.com/micro-gateway:latest
          ports:
            - containerPort: 3000
          
          # Best Practice: Pre-stop Hook
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "15"]

          # Best Practice: Probes
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 20
          
          readinessProbe:
            httpGet:
              path: /health 
              port: 3000
            periodSeconds: 10

          # Best Practice: Externalized Configs
          envFrom:
            - configMapRef:
                name: micro-config
          
          # Best Practice: Resource Management
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  # Best Practice: Use ClusterIP when behind an Ingress (saves cost and improves security)
  type: ClusterIP 
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: gateway
