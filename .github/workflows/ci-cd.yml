name: Manual Microservice Build

on:
  # This allows you to trigger the build manually from the GitHub UI
  workflow_dispatch:
    inputs:
      service:
        description: 'Select the service to build and push'
        required: true
        default: 'gateway'
        type: choice
        options:
          - gateway
          - user-service
          - product-service
          - order-service

jobs:
  build-and-push-microservice:
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: ${{ github.event.inputs.service }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ github.event.inputs.service }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd services/$SERVICE_NAME
          npm install


      - name: Run Tests
        run: |
          cd services/$SERVICE_NAME
          npm test || echo "No tests found"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: micro-${{ github.event.inputs.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest services/$SERVICE_NAME

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/micro-${{ github.event.inputs.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Image to AWS ECR
        if: success()
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: micro-${{ github.event.inputs.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
         
      # Update Kubeconfig
      - name: Update kubeconfig
        run: aws eks --region ${{ secrets.AWS_REGION }} update-kubeconfig --name action-eks-cluster

      # Deploy to Amazon EKS
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: micro-${{ github.event.inputs.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Apply base configs
          kubectl apply -f infra/k8s/base-config.yaml
          kubectl apply -f infra/k8s/mongodb.yaml
          kubectl apply -f infra/k8s/gateway.yaml
          kubectl apply -f infra/k8s/order-service.yaml
          kubectl apply -f infra/k8s/product-service.yaml
          kubectl apply -f infra/k8s/user-service.yaml
          
          # Apply the service manifest
          #kubectl apply -f infra/k8s/$SERVICE_NAME.yaml
          
          # Force the deployment to use the new image we just built
          # Note: We use $SERVICE_NAME because the YAML name and container name match
          #kubectl set image deployment/$SERVICE_NAME $SERVICE_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


          

